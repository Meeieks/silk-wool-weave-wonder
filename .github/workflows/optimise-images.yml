name: Optimise website images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimise-images.yml'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install Pillow
      - name: Convert large website images to WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          targets = ["hero.png", "carpet-1.png", "cleaned-removebg-preview.png", "silk-removebg-preview.png"]
          for name in targets:
              path = Path(name)
              if not path.exists():
                  print(f"Skipping missing {name}")
                  continue
              with Image.open(path) as im:
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA" if "transparency" in im.info else "RGB")
                  out = path.with_suffix(".webp")
                  im.save(out, "WEBP", quality=82, method=6)
                  print(f"{name}: {path.stat().st_size:,} bytes -> {out.stat().st_size:,} bytes")
          PY
      - name: Commit optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero.webp carpet-1.webp cleaned-removebg-preview.webp silk-removebg-preview.webp
          git diff --cached --quiet || git commit -m "Add optimised WebP image assets"
          git push
